apply plugin: 'com.android.application'

// Signing details live outside the repository. Without the file a release build
// still assembles, unsigned, so a checkout without the key is not broken.
def keystoreFile = rootProject.file('keystore.properties')
def besideWinlator = project.hasProperty('besideWinlator')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'com.winlator'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // The Winlator rootfs bakes /data/data/com.winlator into wineserver,
        // ntdll, box64 and ld.so.cache in fixed-size fields, so the id stays
        // com.winlator - and the launcher cannot be installed beside Winlator.
        // -PbesideWinlator builds the variant that can: a same-length id, with
        // every unpacked runtime file rewritten to it (DD1Relocation) and the
        // native libraries told where their sockets now live.
        applicationId besideWinlator ? 'com.dd1.wine' : 'com.winlator'
        manifestPlaceholders = [providerAuthority: (besideWinlator ? 'com.dd1.wine' : 'com.winlator') + '.FileProvider']
        externalNativeBuild {
            cmake {
                if (besideWinlator) cFlags '-DDD1_BESIDE_WINLATOR=1'
            }
        }
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 13
        versionName "0.1.12"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (keystore['storeFile']) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 is left off: the runtime reaches its own classes by name and
            // shrinking them is a whole verification pass of its own.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystore['storeFile']) signingConfig signingConfigs.release

            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libFLAC.so'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
